[package]
name = "steam-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
sysinfo = "0.35"
rusty-leveldb = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
pretty_assertions = "1"
